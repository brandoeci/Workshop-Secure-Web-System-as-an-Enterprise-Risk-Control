# ---------------------------------------------------------------------------
# Enterprise Risk Lab API - OAuth 2.0 resource server
#
# Both values below are validated on every request:
#   issuer-uri -> the token was issued by our Auth0 tenant (and its signature
#                 is checked against that tenant's published JWKS)
#   audiences  -> the token was minted for THIS API, so a token issued for
#                 another API cannot be replayed here
#
# The issuer URI must include https:// and the trailing slash, exactly as
# Auth0 puts it in the "iss" claim.
# Override per environment with the SPRING_SECURITY_OAUTH2_* variables
# (see deploy/enterprise-risk-api.service) and never commit real values.
# ---------------------------------------------------------------------------
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI:https://YOUR_TENANT.us.auth0.com/}
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE:https://enterprise-risk-api}

server.port=${SERVER_PORT:8080}
# Bind to loopback only: the public entry point is Apache on 80/443.
server.address=${SERVER_ADDRESS:127.0.0.1}

# Exact browser origins allowed to call the API. No wildcards.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,https://YOUR-SUBDOMAIN.duckdns.org}

# Health endpoint only - do not publish env, beans, heapdump, ...
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Audit logging: who called what, without ever touching the token value.
logging.level.com.eci.risk=INFO
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n
