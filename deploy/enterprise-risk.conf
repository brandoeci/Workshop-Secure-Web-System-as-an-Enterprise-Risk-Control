# /etc/apache2/sites-available/enterprise-risk.conf
#
# Port 80 virtual host. `certbot --apache` reads this file, adds the TLS
# virtual host on 443 and rewrites port 80 into a redirect to HTTPS.
<VirtualHost *:80>
    ServerName YOUR-SUBDOMAIN.duckdns.org
    DocumentRoot /var/www/enterprise-risk-frontend

    <Directory /var/www/enterprise-risk-frontend>
        Options -Indexes
        AllowOverride None
        Require all granted

        # Single page application: anything that is not a real file is
        # served by index.html so client-side routes work on reload.
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.html [L]
    </Directory>

    # The API is never published directly; only Apache can reach 127.0.0.1:8080.
    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:8080/api/
    ProxyPassReverse /api/ http://127.0.0.1:8080/api/
    RequestHeader set X-Forwarded-Proto "http"

    # Do not advertise the server version or the proxied backend.
    Header always unset X-Powered-By
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/enterprise-risk-error.log
    CustomLog ${APACHE_LOG_DIR}/enterprise-risk-access.log combined
</VirtualHost>
